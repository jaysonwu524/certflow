services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: certflow
      POSTGRES_USER: certflow
      POSTGRES_PASSWORD: certflow
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U certflow -d certflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - certflow-postgres:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://certflow:certflow@postgres:5432/certflow?sslmode=disable
      CERTFLOW_ADDR: :8080
      CERTFLOW_ENCRYPTION_KEY: ${CERTFLOW_ENCRYPTION_KEY:?CERTFLOW_ENCRYPTION_KEY is required}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  certflow-postgres:
