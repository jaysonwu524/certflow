services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: certflow
      POSTGRES_USER: certflow
      POSTGRES_PASSWORD: certflow
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U certflow -d certflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - certflow-postgres:/var/lib/postgresql/data

  control-plane:
    build:
      context: ../../apps/control-plane
    environment:
      DATABASE_URL: postgres://certflow:certflow@postgres:5432/certflow?sslmode=disable
      CERTFLOW_ADDR: :8080
      CERTFLOW_ENCRYPTION_KEY: ${CERTFLOW_ENCRYPTION_KEY:?CERTFLOW_ENCRYPTION_KEY is required}
      CERTFLOW_ADMIN_EMAIL: ${CERTFLOW_ADMIN_EMAIL:-admin@localhost}
      CERTFLOW_ADMIN_PASSWORD: ${CERTFLOW_ADMIN_PASSWORD:-admin}
      CERTFLOW_SESSION_TTL_HOURS: ${CERTFLOW_SESSION_TTL_HOURS:-8}
      CERTFLOW_SESSION_IDLE_MINUTES: ${CERTFLOW_SESSION_IDLE_MINUTES:-30}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

  console:
    build:
      context: ../../apps/console
    environment:
      CERTFLOW_API_URL: http://control-plane:8080
    depends_on:
      - control-plane
    ports:
      - "3000:3000"

volumes:
  certflow-postgres:
