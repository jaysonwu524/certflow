name: Bug Report
description: Report a bug to help us improve
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你花时间填写此 Bug 报告！

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 请清晰简洁地描述遇到的问题
      placeholder: 描述你遇到的 bug...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 告诉我们如何复现这个问题
      placeholder: |
        1. 执行 '...'
        2. 点击 '...'
        3. 滚动到 '...'
        4. 看到错误
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 描述你期望发生什么
      placeholder: 应该...
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 描述实际发生了什么
      placeholder: 但是...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 相关日志
      description: 请粘贴相关的日志输出（如果有）
      render: shell
      placeholder: |
        日志输出...

  - type: textarea
    id: environment
    attributes:
      label: 环境信息
      description: 请提供你的环境信息
      value: |
        - OS: [e.g. Ubuntu 22.04]
        - Go Version: [e.g. 1.21.0]
        - Node.js Version: [e.g. 18.17.0]
        - CertFlow Version: [e.g. v0.1.0]
        - Database: [e.g. PostgreSQL 16]
      render: markdown
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: 其他信息
      description: 添加任何其他关于该问题的上下文信息
      placeholder: 例如截图、相关配置等...

  - type: checkboxes
    id: terms
    attributes:
      label: 确认事项
      description: 在提交之前，请确认以下事项
      options:
        - label: 我已经搜索过现有的 Issues，没有发现重复的问题
          required: true
        - label: 我已经阅读了文档和故障排查指南
          required: true
        - label: 这个问题可以稳定复现
          required: false
