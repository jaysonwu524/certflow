name: Feature Request
description: Suggest a new feature or enhancement
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你提出新功能建议！

  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      description: 你遇到了什么问题？这个功能将解决什么痛点？
      placeholder: 当我使用 CertFlow 时，我遇到了...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 建议的解决方案
      description: 你希望如何解决这个问题？
      placeholder: 我希望能够...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你考虑过哪些替代方案？
      placeholder: 我也考虑过...

  - type: textarea
    id: use-case
    attributes:
      label: 使用场景
      description: 请描述具体的使用场景
      placeholder: |
        作为一个 [角色]，
        我想要 [功能]，
        以便 [目标]。
    validations:
      required: true

  - type: textarea
    id: examples
    attributes:
      label: 示例
      description: 如果可能，请提供使用示例或 mock
      placeholder: |
        ```yaml
        # 配置示例
        ```

  - type: dropdown
    id: priority
    attributes:
      label: 优先级
      description: 这个功能对你有多重要？
      options:
        - 低 - 有这个功能更好
        - 中 - 我需要这个功能
        - 高 - 没有这个功能我无法使用
    validations:
      required: true

  - type: checkboxes
    id: willing-to-contribute
    attributes:
      label: 贡献意愿
      description: 你是否愿意帮助实现这个功能？
      options:
        - label: 我愿意提交 Pull Request 来实现这个功能
          required: false

  - type: checkboxes
    id: terms
    attributes:
      label: 确认事项
      description: 在提交之前，请确认以下事项
      options:
        - label: 我已经搜索过现有的 Issues，没有发现重复的功能请求
          required: true
        - label: 这个功能符合 CertFlow 的项目范围和目标
          required: true
