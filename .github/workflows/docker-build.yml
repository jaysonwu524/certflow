name: CertFlow CI and Docker publish

on:
  push:
    tags: ["v*"]

concurrency:
  group: certflow-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  CONTROL_PLANE_IMAGE: ghcr.io/${{ github.repository_owner }}/certflow-control-plane
  CONSOLE_IMAGE: ghcr.io/${{ github.repository_owner }}/certflow-console

jobs:
  test:
    name: Test and validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify release tag is on main
        run: |
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: apps/control-plane/go.mod
          cache: true

      - name: Go tests and vet
        working-directory: apps/control-plane
        run: |
          go test ./...
          go vet ./...

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/console/package-lock.json

      - name: Frontend lint and build
        working-directory: apps/console
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Validate production Compose
        run: |
          docker compose --env-file .env.production.example -f deploy/compose/docker-compose.prod.yml config
          docker compose --env-file .env.production.external-db.example -f deploy/compose/docker-compose.prod.yml -f deploy/compose/docker-compose.external-db.yml config

  publish:
    name: Publish images to GHCR
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (control plane)
        id: control-plane-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.CONTROL_PLANE_IMAGE }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Docker metadata (console)
        id: console-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.CONSOLE_IMAGE }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and push control plane
        uses: docker/build-push-action@v6
        with:
          context: ./apps/control-plane
          file: ./apps/control-plane/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.control-plane-meta.outputs.tags }}
          labels: ${{ steps.control-plane-meta.outputs.labels }}
          cache-from: type=gha,scope=control-plane
          cache-to: type=gha,mode=max,scope=control-plane

      - name: Build and push console
        uses: docker/build-push-action@v6
        with:
          context: ./apps/console
          file: ./apps/console/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.console-meta.outputs.tags }}
          labels: ${{ steps.console-meta.outputs.labels }}
          cache-from: type=gha,scope=console
          cache-to: type=gha,mode=max,scope=console
